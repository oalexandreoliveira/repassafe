project_id = "repassafe"
[api]
enabled = true
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
mfa.max_enrolled_factors = 10
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[storage]
enabled = true
# Modelos dos e-mails de acesso, em português. O projeto publicado usa o mesmo
# texto, aplicado no painel (Authentication > Emails > Templates).
[auth.email.template.confirmation]
subject = "Confirme seu e-mail no Repassafe"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.invite]
subject = "Convite para o Repassafe"
content_path = "./supabase/templates/invite.html"
[auth.email.template.magic_link]
subject = "Seu link de acesso ao Repassafe"
content_path = "./supabase/templates/magic_link.html"
[auth.email.template.email_change]
subject = "Confirme seu novo e-mail no Repassafe"
content_path = "./supabase/templates/email_change.html"
[auth.email.template.recovery]
subject = "Redefina sua senha do Repassafe"
content_path = "./supabase/templates/recovery.html"
[auth.email.template.reauthentication]
subject = "{{ .Token }} é seu código de verificação"
content_path = "./supabase/templates/reauthentication.html"
